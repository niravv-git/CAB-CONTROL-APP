<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CABwise – No Connection</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e0e0ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      opacity: 0.6;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #a8a8ff;
    }
    p {
      font-size: 1rem;
      color: #888;
      max-width: 320px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      background: #6c63ff;
      color: white;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background: #574fd6; }
  </style>
</head>
<body>
  <div class="icon">🚕</div>
  <h1>You're Offline</h1>
  <p>CABwise needs a connection to load for the first time. Once loaded, it works offline.</p>
  <a class="btn" href="./index.html">Try Again</a>
</body>
</html>
