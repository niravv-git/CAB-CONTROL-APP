<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wheel Up - Fleet &amp; Cab Business Dashboard</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Wheel Up – Manage your cab fleet business. Track revenue, expenses, drivers, and owner payouts from anywhere.">
  <meta name="keywords" content="cab fleet management, taxi business dashboard, driver tracking, revenue tracking">
  <meta name="author" content="Wheel Up">

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#6c63ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wheel Up">
  <meta name="application-name" content="Wheel Up">
  <meta name="msapplication-TileColor" content="#0f0f1a">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- App Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- PWA Install Banner Styles -->
  <style>
    #pwa-install-banner {
      display: none;
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #6c63ff, #574fd6);
      color: white;
      padding: 0.85rem 1.5rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 8px 30px rgba(108, 99, 255, 0.4);
      z-index: 99999;
      white-space: nowrap;
      cursor: pointer;
      border: none;
      align-items: center;
      gap: 0.6rem;
      animation: slideUp 0.4s ease;
    }
    #pwa-install-banner.visible { display: flex; }
    #pwa-install-banner i { font-size: 1.1rem; }
    #pwa-dismiss-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      margin-left: 0.4rem;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* Offline indicator */
    #offline-toast {
      display: none;
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: #ff6b6b;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      z-index: 99999;
      align-items: center;
      gap: 0.5rem;
    }
    #offline-toast.visible { display: flex; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="App.toggleMobileSidebar(false)"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="app-sidebar">
      <div class="brand">
        <div class="brand-logo">
          <i class="fa-solid fa-taxi"></i>
        </div>
        <div class="brand-info">
          <h2>Wheel Up</h2>
          <span class="sub-text">Fleet &amp; Finance Hub</span>
        </div>
      </div>

      <nav class="nav-menu">
        <button class="nav-item active" data-sheet="dashboard">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-sheet="owners">
          <i class="fa-solid fa-user-tie"></i>
          <span>Owners</span>
          <span class="badge badge-payable" id="nav-payable-badge">₹0</span>
        </button>
        <button class="nav-item" data-sheet="cabs">
          <i class="fa-solid fa-car-side"></i>
          <span>Cabs</span>
          <span class="badge" id="nav-cabs-count">0</span>
        </button>
        <button class="nav-item" data-sheet="drivers">
          <i class="fa-solid fa-id-card"></i>
          <span>Drivers</span>
          <span class="badge" id="nav-drivers-count">0</span>
        </button>
        <button class="nav-item" data-sheet="reminders">
          <i class="fa-solid fa-calendar-check"></i>
          <span>Reminders</span>
          <span class="badge badge-alert" id="nav-reminders-badge">0</span>
        </button>
      </nav>

      <div class="quick-actions-box">
        <span class="box-title"><i class="fa-solid fa-bolt"></i> Quick Actions</span>
        <div class="action-buttons">
          <button class="btn btn-sm btn-primary-soft" onclick="App.openModal('log-revenue')">
            <i class="fa-solid fa-hand-holding-dollar"></i> Recv Revenue
          </button>
          <button class="btn btn-sm btn-danger-soft" onclick="App.openModal('log-expense')">
            <i class="fa-solid fa-receipt"></i> Log Expense
          </button>
          <button class="btn btn-sm btn-success-soft" onclick="App.openModal('log-payout')">
            <i class="fa-solid fa-money-bill-transfer"></i> Pay Owner
          </button>
          <button class="btn btn-sm btn-secondary-soft" onclick="App.openModal('allocate-driver')">
            <i class="fa-solid fa-calendar-plus"></i> Assign Cab
          </button>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle-btn" title="Toggle Light/Dark Theme">
          <i class="fa-solid fa-moon"></i> <span id="theme-text">Dark Mode</span>
        </button>
        <div class="backup-tools">
          <button class="btn-icon" onclick="Store.exportData()" title="Backup / Export Data (JSON)">
            <i class="fa-solid fa-download"></i>
          </button>
          <button class="btn-icon" onclick="document.getElementById('import-file-input').click()" title="Restore / Import Data (JSON)">
            <i class="fa-solid fa-upload"></i>
          </button>
          <input type="file" id="import-file-input" accept=".json" style="display: none;" onchange="Store.importData(event)">
          <button class="btn-icon text-danger" onclick="Store.resetToDemo()" title="Reset to Sample Demo Data">
            <i class="fa-solid fa-rotate-left"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-content">
      <!-- Universal Top Bar Header -->
      <header class="topbar">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <button class="mobile-menu-btn" onclick="App.toggleMobileSidebar(true)" title="Open Menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="page-title-area">
            <h1 id="page-heading">Dashboard</h1>
            <p class="subtitle" id="page-subheading">Comprehensive fleet overview &amp; real-time financial tracking</p>
          </div>
        </div>

        <!-- Universal Custom Period & Calendar Filter -->
        <div class="period-picker-container">
          <div class="period-presets">
            <i class="fa-regular fa-calendar-days filter-icon"></i>
            <select id="period-preset-select" class="period-select">
              <option value="this-month">This Month</option>
              <option value="last-month">Last Month</option>
              <option value="today">Today</option>
              <option value="this-week">This Week</option>
              <option value="this-quarter">This Quarter</option>
              <option value="this-year">This Year</option>
              <option value="all-time">All Time</option>
              <option value="custom">Custom Period</option>
            </select>
          </div>

          <div class="custom-date-inputs hidden" id="custom-date-range-box">
            <input type="date" id="start-date-input" class="date-input">
            <span class="range-separator">to</span>
            <input type="date" id="end-date-input" class="date-input">
            <button class="btn btn-xs btn-primary" id="apply-date-range-btn">Apply</button>
          </div>

          <div class="active-period-pill" id="active-period-display">
            <i class="fa-solid fa-filter"></i> Oct 01, 2026 - Oct 31, 2026
          </div>
        </div>
      </header>

      <!-- Dynamic Views Container -->
      <div class="content-body">
        
        <!-- Sheet 1: Dashboard -->
        <section id="sheet-dashboard" class="sheet-view active">
          <!-- Dashboard contents rendered dynamically via dashboard.js -->
        </section>

        <!-- Sheet 2: Owners -->
        <section id="sheet-owners" class="sheet-view">
          <!-- Owners contents rendered dynamically via owners.js -->
        </section>

        <!-- Sheet 3: Cabs -->
        <section id="sheet-cabs" class="sheet-view">
          <!-- Cabs contents rendered dynamically via cabs.js -->
        </section>

        <!-- Sheet 4: Drivers -->
        <section id="sheet-drivers" class="sheet-view">
          <!-- Drivers contents rendered dynamically via drivers.js -->
        </section>

        <!-- Sheet 5: Reminders -->
        <section id="sheet-reminders" class="sheet-view">
          <!-- Reminders contents rendered dynamically via reminders.js -->
        </section>

      </div>
    </main>
  </div>

  <!-- Universal Modal Dialog Container -->
  <div class="modal-overlay" id="global-modal-overlay">
    <div class="modal-card" id="global-modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Title</h3>
        <button class="modal-close-btn" onclick="App.closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Offline Indicator -->
  <div id="offline-toast">
    <i class="fa-solid fa-wifi-slash"></i> You are offline – data saved locally
  </div>

  <!-- PWA Install Banner -->
  <button id="pwa-install-banner" title="Install Wheel Up on your device">
    <i class="fa-solid fa-mobile-screen-button"></i>
    <span>Install App on Phone</span>
    <button id="pwa-dismiss-btn" onclick="dismissInstallBanner(event)" title="Dismiss">✕</button>
  </button>

  <!-- Application Scripts -->
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/sheets/dashboard.js"></script>
  <script src="js/sheets/owners.js"></script>
  <script src="js/sheets/cabs.js"></script>
  <script src="js/sheets/drivers.js"></script>
  <script src="js/sheets/reminders.js"></script>
  <script src="js/app.js"></script>

  <!-- PWA Registration Script -->
  <script>
    // ── Service Worker Registration ──
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => {
            console.log('[PWA] Service Worker registered. Scope:', reg.scope);

            // Listen for updates
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New version available – could show update prompt
                  console.log('[PWA] New version available.');
                }
              });
            });
          })
          .catch(err => console.warn('[PWA] Service Worker registration failed:', err));
      });
    }

    // ── Offline / Online Detection ──
    const offlineToast = document.getElementById('offline-toast');
    function updateOnlineStatus() {
      if (!navigator.onLine) {
        offlineToast.classList.add('visible');
      } else {
        offlineToast.classList.remove('visible');
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // ── PWA Install Prompt ──
    let deferredPrompt = null;
    const installBanner = document.getElementById('pwa-install-banner');

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      // Show banner only if not dismissed before
      if (!localStorage.getItem('pwa-install-dismissed')) {
        installBanner.classList.add('visible');
      }
    });

    installBanner.addEventListener('click', async (e) => {
      if (e.target.id === 'pwa-dismiss-btn' || e.target.closest('#pwa-dismiss-btn')) return;
      if (!deferredPrompt) return;
      installBanner.classList.remove('visible');
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log('[PWA] Install outcome:', outcome);
      deferredPrompt = null;
    });

    function dismissInstallBanner(e) {
      e.stopPropagation();
      installBanner.classList.remove('visible');
      localStorage.setItem('pwa-install-dismissed', '1');
    }

    // Auto-hide installed banner when app is in standalone mode
    if (window.matchMedia('(display-mode: standalone)').matches) {
      installBanner.style.display = 'none';
    }
  </script>
</body>
</html>
